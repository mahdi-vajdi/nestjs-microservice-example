name: nestjs-ecommerce-microservices

services:

  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}' ]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.14.6-alpine
    restart: unless-stopped
    # -js enables JetStream; -m 8222 enables the HTTP monitoring endpoint
    command: -js -m 8222
    ports:
      - '${NATS_CLIENT_PORT:-4222}:4222'
      - '${NATS_MGMT_PORT:-8222}:8222'
    volumes:
      - nats_data:/data
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://localhost:8222/healthz || exit 1' ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Application services ─────────────────────────────────────────────────────

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - NATS_SERVERS=nats://nats:4222
      - REDIS_HOST=redis
      - NATS_CONSUMER_DURABLE_NAME=user-service-consumer
    ports:
      - '${GRPC_USER_PORT:-50051}:50051'
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - NATS_SERVERS=nats://nats:4222
      - REDIS_HOST=redis
      - NATS_CONSUMER_DURABLE_NAME=auth-service-consumer
    ports:
      - '${GRPC_AUTH_PORT:-50052}:50052'
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway-service:
    build:
      context: .
      dockerfile: apps/gateway-service/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NATS_SERVERS=nats://nats:4222
      - GRPC_USER_HOST=user-service
      - GRPC_AUTH_HOST=auth-service
      - NATS_CONSUMER_DURABLE_NAME=gateway-service-consumer
      - REDIS_HOST=redis
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      auth-service:
        condition: service_started

volumes:
  postgres_data:
  nats_data:
  redis_data:
